<app-header></app-header>
<main class="main-content">
  <router-outlet></router-outlet>
</main>

@if (uiState.showSignInModal()) {
  <div class="modal-overlay" (click)="uiState.closeSignIn()">
    <div class="modal" (click)="$event.stopPropagation()">
      <h2>Sign In</h2>
      <p>Enter a username to get started</p>
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="Your username"
        class="input"
        (keydown.enter)="signIn()"
        autofocus
      />
      <div class="modal-actions">
        <button class="btn btn-ghost" (click)="uiState.closeSignIn()">Cancel</button>
        <button class="btn btn-primary" (click)="signIn()" [disabled]="!username.trim()">
          Sign In
        </button>
      </div>
    </div>
  </div>
}
